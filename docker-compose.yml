services:
  db:
    image: postgres:16-alpine
    container_name: patrimonio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: patrimonio
      POSTGRES_PASSWORD: patrimonio
      POSTGRES_DB: patrimonio
    ports:
      - "5435:5432"
    volumes:
      - patrimonio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrimonio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  patrimonio_pgdata:
